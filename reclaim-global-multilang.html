<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="meta.title">Reclaim Global Trading — Used Smartphone Sourcing & Export from Hong Kong</title>
<meta name="description" data-i18n="meta.desc" content="Hong Kong-based used smartphone sourcing specialist. We buy tested, graded iPhones, Samsung, Pixel and more from suppliers across UK, USA, Europe and Asia.">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f9d6b'/><path d='M30 25h40a5 5 0 015 5v40a5 5 0 01-5 5H30a5 5 0 01-5-5V30a5 5 0 015-5zm5 10v30h30V35H35zm8 36a4 4 0 100 8 4 4 0 000-8z' fill='white'/></svg>">
<style>
  :root {
    --green-900: #0a3d28; --green-800: #0f5132; --green-700: #146c43;
    --green-600: #1f9d6b; --green-500: #2db87f; --green-400: #5cc9a0;
    --green-300: #8ed9bc; --green-200: #c7f0e0; --green-100: #d4f5e6;
    --green-50: #f0faf5; --green-bg: #f7fcf9;
    --text-dark: #0f2e20; --text-mid: #3d6b54; --text-light: #6b9480; --text-faint: #9ab8a8;
    --white: #fff; --card-bg: rgba(255,255,255,0.92);
    --warm: #f4b942; --warm-dark: #e0a52e;
    --radius: 20px; --radius-sm: 12px;
    --shadow-sm: 0 2px 12px rgba(15,81,50,0.06);
    --shadow: 0 8px 32px rgba(15,81,50,0.10);
    --shadow-lg: 0 20px 60px rgba(15,81,50,0.14);
    --border: rgba(31,157,107,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'Noto Sans TC', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-dark); background: var(--green-bg); line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { font-family: 'Space Grotesk', 'Plus Jakarta Sans', 'Noto Sans SC', 'Noto Sans TC', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans Thai', sans-serif; letter-spacing: -0.02em; }
  a { color: inherit; text-decoration: none; }
  img { max-width:100%; display:block; }
  ul { list-style: none; }

  /* Language Switcher */
  .lang-switcher { position: relative; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: 1.5px solid var(--border);
    padding: 8px 14px; border-radius: 100px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--text-mid); font-family: inherit; transition: all .2s;
  }
  .lang-btn:hover { border-color: var(--green-400); color: var(--green-700); }
  .lang-btn svg { width:14px; height:14px; }
  .lang-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0; background: white; border-radius: 14px;
    box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 8px; min-width: 160px;
    z-index: 200; display: none;
  }
  .lang-dropdown.open { display: block; }
  .lang-option {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
    cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-mid); transition: background .15s;
  }
  .lang-option:hover { background: var(--green-50); color: var(--green-700); }
  .lang-option.active { background: var(--green-100); color: var(--green-800); font-weight: 600; }
  .lang-option .flag { font-size: 18px; line-height: 1; }

  .topbar { background: var(--green-900); color: rgba(255,255,255,0.8); font-size: 13px; padding: 10px 0; }
  .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .topbar-left { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .topbar-left span { display: flex; align-items: center; gap: 8px; }
  .topbar-left svg { width:14px; height:14px; opacity:0.7; }
  .topbar-right a { font-weight: 600; color: var(--warm); }

  nav { background: rgba(255,255,255,0.88); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 76px; }
  .logo { font-size: 21px; font-weight: 700; color: var(--green-800); display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; }
  .logo-mark { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--green-600), var(--green-400)); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 16px rgba(31,157,107,0.3); }
  .logo-mark svg { width:22px; height:22px; }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-links > a { font-size: 14.5px; font-weight: 500; color: var(--text-mid); transition: color .2s; }
  .nav-links > a:hover { color: var(--green-600); }
  .nav-cta { background: var(--green-600); color: white !important; padding: 11px 26px; border-radius: 100px; font-weight: 600 !important; transition: all .2s; box-shadow: 0 4px 16px rgba(31,157,107,0.25); }
  .nav-cta:hover { background: var(--green-700); transform: translateY(-1px); }
  .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--green-800); padding: 8px; }
  .menu-toggle svg { width:26px; height:26px; }

  .hero { background: linear-gradient(155deg, var(--green-100) 0%, var(--green-200) 35%, var(--green-50) 70%, var(--green-bg) 100%); padding: 72px 32px 90px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -160px; right: -100px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(92,201,160,0.22), transparent 65%); }
  .hero::after { content: ''; position: absolute; bottom: -120px; left: -80px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(244,185,66,0.1), transparent 65%); }
  .hero-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; position: relative; z-index: 1; }
  .hero-tag { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.75); border: 1px solid var(--border); padding: 9px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--green-700); margin-bottom: 24px; backdrop-filter: blur(8px); }
  .hero-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-500); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(1.3);} }
  .hero h1 { font-size: clamp(38px, 4.8vw, 60px); font-weight: 700; line-height: 1.08; color: var(--green-900); margin-bottom: 22px; }
  .hero h1 .accent { background: linear-gradient(120deg, var(--green-600), var(--green-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero p.lead { font-size: 17.5px; color: var(--text-mid); max-width: 540px; margin-bottom: 34px; line-height: 1.75; }
  .hero-buttons { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 44px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 32px; border-radius: 100px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; font-family: inherit; }
  .btn svg { width:16px; height:16px; }
  .btn-primary { background: var(--green-600); color: white; box-shadow: 0 6px 24px rgba(31,157,107,0.3); }
  .btn-primary:hover { background: var(--green-700); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(31,157,107,0.4); }
  .btn-outline { background: rgba(255,255,255,0.7); color: var(--green-800); border: 2px solid var(--border); backdrop-filter: blur(8px); }
  .btn-outline:hover { background: white; border-color: var(--green-400); }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-card { background: var(--card-bg); border-radius: var(--radius-sm); padding: 18px 16px; box-shadow: var(--shadow-sm); border: 1px solid rgba(255,255,255,0.7); text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--green-800); line-height: 1.1; font-family: 'Space Grotesk', sans-serif; }
  .stat-label { font-size: 11px; color: var(--text-light); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

  .hero-visual { position: relative; display: flex; justify-content: center; align-items: center; }
  .phone-stack { position: relative; width: 100%; max-width: 400px; aspect-ratio: 4/5; }
  .phone-card { position: absolute; background: white; border-radius: 32px; box-shadow: var(--shadow-lg); padding: 14px; display: flex; flex-direction: column; align-items: center; }
  .phone-card.main { width: 70%; top: 10%; left: 15%; z-index: 3; transform: rotate(-2deg); }
  .phone-card.back1 { width: 58%; top: 5%; left: 5%; z-index: 1; transform: rotate(-14deg); opacity: 0.65; }
  .phone-card.back2 { width: 58%; top: 14%; right: 3%; z-index: 2; transform: rotate(11deg); opacity: 0.8; }
  .phone-screen { width: 100%; aspect-ratio: 9/16; border-radius: 22px; background: linear-gradient(160deg, var(--green-100), var(--green-50)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .phone-screen .check-icon { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--green-500), var(--green-400)); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 6px 20px rgba(31,157,107,0.35); }
  .phone-screen .check-icon svg { width:28px; height:28px; }
  .phone-screen .label { font-size: 12px; font-weight: 700; color: var(--green-800); text-align: center; padding: 0 16px; line-height: 1.5; }
  .phone-screen .grade-badge { position: absolute; top: 14px; right: 14px; background: var(--warm); color: var(--green-900); font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 100px; text-transform: uppercase; }
  .phone-home { width: 70px; height: 5px; border-radius: 3px; background: var(--green-200); }
  .float-badge { position: absolute; background: white; border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: var(--green-800); z-index: 5; border: 1px solid var(--border); }
  .float-badge.b1 { top: 10%; right: -6%; }
  .float-badge.b2 { bottom: 16%; left: -10%; }
  .float-badge .badge-icon { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--green-500), var(--green-400)); display: flex; align-items: center; justify-content: center; color: white; }
  .float-badge .badge-icon svg { width:18px; height:18px; }
  .float-badge small { display:block; font-size: 11px; color: var(--text-light); font-weight: 500; margin-top: 2px; }

  .trust-bar { background: var(--green-800); padding: 36px 32px; }
  .trust-inner { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 24px; }
  .trust-item { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500; }
  .trust-item svg { width:24px; height:24px; color: var(--green-400); flex-shrink:0; }
  .trust-item strong { color: white; font-weight: 700; display: block; font-size: 15px; }

  section { padding: 88px 32px; }
  .section-inner { max-width: 1280px; margin: 0 auto; }
  .section-head { text-align: center; max-width: 680px; margin: 0 auto 56px; }
  .section-head .eyebrow { font-size: 13px; font-weight: 700; color: var(--green-600); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .section-head .eyebrow::before { content: ''; width: 24px; height: 2px; background: var(--green-400); border-radius: 2px; }
  .section-head h2 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 700; color: var(--green-900); line-height: 1.15; margin-bottom: 18px; }
  .section-head p { font-size: 16.5px; color: var(--text-mid); line-height: 1.75; }

  .about { background: white; }
  .about-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 64px; align-items: center; }
  .about-visual { background: linear-gradient(155deg, var(--green-100), var(--green-200)); border-radius: 28px; padding: 44px; position: relative; overflow: hidden; min-height: 420px; display: flex; align-items: center; justify-content: center; }
  .about-visual::after { content: ''; position: absolute; bottom: -80px; right: -60px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(244,185,66,0.18), transparent 70%); }
  .about-icon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; position: relative; z-index: 1; width: 100%; }
  .about-icon-card { background: white; border-radius: 18px; padding: 26px 20px; text-align: center; box-shadow: var(--shadow); transition: transform .25s; }
  .about-icon-card:hover { transform: translateY(-4px); }
  .about-icon-card .ic { width:44px; height:44px; margin: 0 auto 10px; border-radius: 12px; background: linear-gradient(135deg, var(--green-100), var(--green-200)); display:flex; align-items:center; justify-content:center; }
  .about-icon-card .ic svg { width:22px; height:22px; color: var(--green-600); }
  .about-icon-card .t { font-size: 13px; font-weight: 700; color: var(--green-800); }
  .about-content .eyebrow { font-size: 13px; font-weight: 700; color: var(--green-600); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 14px; }
  .about-content h3 { font-size: 32px; font-weight: 700; color: var(--green-900); margin-bottom: 20px; line-height: 1.2; }
  .about-content p { color: var(--text-mid); margin-bottom: 16px; line-height: 1.8; font-size: 15.5px; }
  .about-features { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  .about-feature { display: flex; gap: 14px; align-items: flex-start; }
  .about-feature .check { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--green-600); color: white; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .about-feature .check svg { width:14px; height:14px; }
  .about-feature span { font-size: 15px; color: var(--text-dark); font-weight: 500; line-height: 1.5; }
  .about-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 36px; padding-top: 32px; border-top: 1px solid var(--border); }
  .metric .num { font-size: 32px; font-weight: 700; color: var(--green-700); font-family: 'Space Grotesk', sans-serif; }
  .metric .lbl { font-size: 13px; color: var(--text-light); margin-top: 4px; font-weight: 500; }

  .products { background: var(--green-bg); }
  .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .product-card { background: white; border-radius: var(--radius); padding: 30px 26px; box-shadow: var(--shadow-sm); transition: all .3s; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .product-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--green-500), var(--green-400)); transform: scaleX(0); transform-origin: left; transition: transform .3s; }
  .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
  .product-card:hover::before { transform: scaleX(1); }
  .product-icon { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, var(--green-100), var(--green-200)); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .product-icon svg { width:28px; height:28px; color: var(--green-600); }
  .product-card h4 { font-size: 19px; font-weight: 700; color: var(--green-900); margin-bottom: 10px; }
  .product-card p { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 16px; }
  .product-models { font-size: 12px; color: var(--text-mid); line-height: 1.8; }
  .product-models strong { color: var(--green-700); font-weight: 600; }
  .product-card .tag { display: inline-block; margin-top: 16px; font-size: 11px; font-weight: 700; color: var(--green-700); background: rgba(31,157,107,0.1); padding: 5px 14px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em; }

  .grading { background: white; }
  .grading-table-wrap { background: var(--green-bg); border-radius: 24px; padding: 36px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow-x: auto; }
  .grading-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 700px; }
  .grading-table th { text-align: left; padding: 16px 20px; font-size: 13px; font-weight: 700; color: var(--green-800); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 2px solid var(--green-300); }
  .grading-table td { padding: 18px 20px; font-size: 14px; color: var(--text-mid); border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.6; }
  .grading-table tr:last-child td { border-bottom: none; }
  .grade-label { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; font-weight: 800; font-size: 18px; font-family: 'Space Grotesk', sans-serif; }
  .grade-a { background: linear-gradient(135deg, #2db87f, #1f9d6b); color: white; }
  .grade-b { background: linear-gradient(135deg, #5cc9a0, #3db585); color: white; }
  .grade-c { background: linear-gradient(135deg, #f4b942, #e0a52e); color: var(--green-900); }
  .grade-f { background: linear-gradient(135deg, #e07856, #c95a3a); color: white; }
  .grade-name { font-weight: 700; color: var(--green-900); font-size: 15px; margin-bottom: 4px; }

  .qc { background: var(--green-bg); }
  .qc-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .qc-step { background: white; border-radius: var(--radius); padding: 28px 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); position: relative; }
  .qc-step .step-num { position: absolute; top: -14px; left: 24px; width: 36px; height: 36px; border-radius: 50%; background: var(--green-700); color: white; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 4px 12px rgba(15,81,50,0.25); }
  .qc-step .qc-icon { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,var(--green-100),var(--green-200)); display:flex; align-items:center; justify-content:center; margin: 14px 0 16px; }
  .qc-step .qc-icon svg { width:24px; height:24px; color: var(--green-600); }
  .qc-step h4 { font-size: 16px; font-weight: 700; color: var(--green-900); margin-bottom: 8px; }
  .qc-step p { font-size: 13px; color: var(--text-light); line-height: 1.65; }

  .process { background: white; }
  .process-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; position: relative; }
  .process-step { text-align: center; position: relative; padding: 0 12px; }
  .step-circle { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 24px; background: linear-gradient(135deg, var(--green-600), var(--green-400)); color: white; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(31,157,107,0.3); font-family: 'Space Grotesk', sans-serif; position: relative; z-index: 1; }
  .process-step h4 { font-size: 20px; font-weight: 700; color: var(--green-900); margin-bottom: 12px; }
  .process-step p { font-size: 14.5px; color: var(--text-mid); line-height: 1.75; max-width: 300px; margin: 0 auto; }
  .process-connector { position: absolute; top: 36px; left: calc(50% + 48px); width: calc(100% - 96px); height: 3px; background: repeating-linear-gradient(90deg, var(--green-300) 0, var(--green-300) 10px, transparent 10px, transparent 20px); z-index: 0; }

  .shipping { background: var(--green-bg); }
  .shipping-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .shipping-content h3 { font-size: 30px; font-weight: 700; color: var(--green-900); margin-bottom: 18px; line-height: 1.2; }
  .shipping-content p { color: var(--text-mid); margin-bottom: 24px; line-height: 1.8; font-size: 15.5px; }
  .shipping-list { display: flex; flex-direction: column; gap: 16px; }
  .shipping-item { display: flex; gap: 16px; align-items: flex-start; }
  .shipping-item .si-icon { flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; background: white; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .shipping-item .si-icon svg { width:22px; height:22px; color: var(--green-600); }
  .shipping-item h5 { font-size: 15px; font-weight: 700; color: var(--green-900); margin-bottom: 4px; }
  .shipping-item p { font-size: 13.5px; color: var(--text-light); line-height: 1.6; margin: 0; }
  .shipping-visual { background: linear-gradient(155deg, var(--green-800), var(--green-700)); border-radius: 28px; padding: 44px; color: white; position: relative; overflow: hidden; }
